name: medcore

# Compose reads the repository-root .env automatically for ${VAR} interpolation.
# Values here are stack-internal (hostnames, ports) and are set explicitly per service.
# Local development uses only the database: docker compose up -d db

x-build: &build
  context: .
  dockerfile: Dockerfile

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      <<: *build
      target: migrate
    command: ['pnpm', 'run', 'db:migrate']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      <<: *build
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      <<: *build
      target: web
    restart: unless-stopped
    environment:
      NUXT_API_ORIGIN: http://api:8000
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    depends_on:
      - api

volumes:
  postgres-data:
