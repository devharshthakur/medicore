name: medcore

# Compose reads the repository-root .env automatically for ${VAR} interpolation.
# Values here are stack-internal (hostnames, ports) and are set explicitly per service.

x-build: &build
  context: .
  dockerfile: Dockerfile

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: medcore
      POSTGRES_DB: medcore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medcore -d medcore']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      <<: *build
      target: migrate
    command: ['pnpm', 'run', 'db:migrate']
    environment:
      DATABASE_URL: postgres://medcore:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/medcore
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      <<: *build
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://medcore:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/medcore
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      <<: *build
      target: web
    restart: unless-stopped
    environment:
      NUXT_API_ORIGIN: http://api:8000
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    depends_on:
      - api

volumes:
  postgres-data:
